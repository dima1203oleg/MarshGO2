worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name localhost;

        # Proxy to Site (Web/PWA)
        location / {
            proxy_pass http://127.0.0.1:3900;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Proxy API
        location /api/ {
            proxy_pass http://127.0.0.1:3902;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Proxy Admin
        location /admin/ {
            proxy_pass http://127.0.0.1:3903;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Proxy Partner
        location /partner/ {
            proxy_pass http://127.0.0.1:3904;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Proxy map tile server (HTTP only, allow via HTTPS)
        location /tiles/ {
            proxy_pass http://127.0.0.1:3306;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
